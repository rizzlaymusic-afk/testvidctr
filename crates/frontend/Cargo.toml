[package]
name = "flashcut-frontend"
version = "0.1.0"
edition = "2021"

[lib]
name = "flashcut_frontend_wasm"
crate-type = ["cdylib"]

[dependencies]
leptos = { version = "0.6", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "HtmlElement",
    "HtmlVideoElement",
    "HtmlAnchorElement",
    "File",
    "FileList",
    "HtmlInputElement",
    "HtmlCanvasElement",
    "WebSocket",
    "MessageEvent",
    "CloseEvent",
    "console",
    "DragEvent",
    "DataTransfer",
    "Storage",
] }
js-sys = "0.3"
console_error_panic_hook = "0.1"
serde = { workspace = true }
serde_json = { workspace = true }
gloo-timers = "0.3"
flashcut-shared = { path = "../shared" }
flashcut-core-wasm = { path = "../core-wasm" }
